<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Genshin Roster</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Kanit:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14172a; --bg2:#1a1e37; --panel:#232844; --panel2:#2d3354; --line:#373d66;
  --text:#eceaf7; --mute:#9ea2c6; --gold:#f0c060; --gold-d:#2a1c05; --violet:#b9a2ec; --danger:#ff8585;
  --f-head:'Kanit','IBM Plex Sans',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:linear-gradient(180deg,var(--bg2),var(--bg) 380px) fixed,var(--bg);color:var(--text);font:400 15px/1.5 var(--f-body);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}

/* header */
.top{padding:22px 0 16px;display:flex;flex-wrap:wrap;gap:20px 36px;align-items:flex-end;justify-content:space-between}
.who{flex:1 1 320px;min-width:0}
.who small{display:block;color:var(--mute);font-size:13px;margin-bottom:2px}
#player{width:100%;background:transparent;border:0;border-bottom:1px dashed transparent;font:700 clamp(28px,5.4vw,46px)/1.15 var(--f-head);padding:2px 0;color:var(--text)}
#player:hover,#player:focus{border-bottom-color:var(--line);outline:none}
#player::placeholder{color:#5d638f}
.uidrow{display:flex;gap:8px;align-items:center;margin-top:4px;color:var(--mute);font-size:13px}
#uid{width:11ch;background:transparent;border:0;border-bottom:1px dashed var(--line);padding:1px 2px;color:var(--text)}
#uid:focus{outline:none;border-bottom-color:var(--gold)}
.prog{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-top:12px}
.prog .rar{font:500 17px var(--f-head);color:var(--mute)}
.prog .rar b{font-weight:700;color:var(--text);margin-left:5px}
.prog .r5{color:var(--gold)} .prog .r4{color:var(--violet)}
.prog .pct{font:700 40px/1 var(--f-head)}
.prog .frac{font:500 18px var(--f-head);color:var(--mute)}
.elstat{display:grid;grid-template-columns:repeat(7,34px);gap:8px;align-items:end}
.elstat div{display:flex;flex-direction:column;align-items:center;gap:4px}
.elstat em{font-style:normal;font:600 13px var(--f-head)}
.elstat i{display:block;width:100%;min-height:3px;border-radius:3px 3px 1px 1px;background:var(--el)}
.elstat img,.elstat svg{width:22px;height:22px;object-fit:contain;color:var(--el)}
.elstat-wrap p{margin:0 0 6px;font-size:12px;color:var(--mute)}

/* toolbar */
.bar{position:sticky;top:0;z-index:20;background:rgba(20,23,42,.92);backdrop-filter:blur(8px);border-block:1px solid var(--line);padding:10px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row+.row{margin-top:8px}
.field-in{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;min-width:0}
#q{flex:1 1 180px}
select.field-in{padding-right:6px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:7px 12px;color:var(--mute);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--panel2);color:var(--text);font-weight:600}
#fRar button[aria-pressed=true][data-v="5"]{color:var(--gold)}
#fRar button[aria-pressed=true][data-v="4"]{color:var(--violet)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0;flex:1 1 auto}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;border:1px solid var(--line);background:var(--panel);padding:4px 12px 4px 7px;color:var(--mute);white-space:nowrap}
.chip img,.chip svg{width:18px;height:18px;object-fit:contain;color:var(--el)}
.chip.reset{border-style:dashed;color:var(--mute)}
.chip.reset:disabled{opacity:.4;cursor:default}
.chip[aria-pressed=true]{border-color:var(--el);color:var(--text);background:color-mix(in srgb,var(--el) 18%,var(--panel))}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;font-weight:500}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-d);font-weight:600}
.btn.primary:hover{background:#f7cf80}
.btn.danger{color:var(--danger);border-color:#5b3a4a}
.spacer{flex:1}

/* grid + cards */
main{padding:18px 0 80px}
.sec+.sec{margin-top:30px}
.sec h2{margin:0 0 12px;font:700 22px var(--f-head);display:flex;align-items:baseline;gap:10px}
.sec h2 small{font:500 15px var(--f-body);color:var(--mute)}
.star.r5{color:var(--gold)} .star.r4{color:var(--violet)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
@media(min-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;--el:#8a8dad}
.portrait{position:relative;display:block;width:100%;aspect-ratio:1;border:0;padding:0;overflow:hidden;background:var(--grad)}
.r5 .portrait{--grad:linear-gradient(165deg,#6f4a22 0%,#c58b3c 58%,#f2c775 100%)}
.r4 .portrait{--grad:linear-gradient(165deg,#3f3377 0%,#7860b6 58%,#bba5ee 100%)}
.card.off .portrait{--grad:linear-gradient(165deg,#2a2d47,#3c4062)}
.portrait img.pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}
.card.off{opacity:.6}
.card.off .portrait img.pic{filter:grayscale(1) brightness(.8)}
.ph{position:absolute;inset:0;display:grid;place-items:center;font:700 44px var(--f-head);color:#ffffff40}
.elb{position:absolute;left:6px;top:6px;width:24px;height:24px;border-radius:50%;background:#10132299;display:grid;place-items:center;color:var(--el);z-index:2}
.elb img,.elb svg{width:17px;height:17px;object-fit:contain}
.clab{position:absolute;right:6px;bottom:6px;z-index:2;border-radius:6px;background:#10132ad9;padding:0 7px;font:700 14px/22px var(--f-head);color:var(--text)}
.clab.sm{font-size:12px;line-height:19px;padding:0 6px;border-radius:5px}
.clab.c6{background:var(--gold);color:var(--gold-d)}
.nm{padding:9px 6px 10px;font:500 13px/1.25 var(--f-head);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.gold{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 20px -6px var(--gold)}
.card.whale{position:relative;border-width:0;box-shadow:0 0 16px -4px rgba(182,140,255,.7)}
.ring{position:absolute;inset:0;border-radius:10px;padding:2.5px;pointer-events:none;z-index:4;overflow:hidden;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.ring i{position:absolute;inset:0;background:conic-gradient(from 200deg,#ff5f6d,#ffc371,#fff56b,#6bffb0,#5fc8ff,#a07bff,#ff6bd6,#ff5f6d)}
.empty{color:var(--mute);padding:40px 0;text-align:center}
.note{display:none;margin:12px 0 0;padding:9px 12px;border-radius:8px;background:#3a2f1a;color:#f3d89a;font-size:13px;align-items:center;gap:10px;flex-wrap:wrap}
.note.show{display:flex}
.note.hint{background:var(--panel);color:var(--mute)}
.note .btn{padding:4px 10px;font-size:13px}

/* dialogs */
dialog{border:1px solid var(--line);background:var(--bg2);color:var(--text);border-radius:14px;padding:0;width:min(480px,calc(100vw - 20px));max-height:calc(100dvh - 30px);overflow:auto}
dialog::backdrop{background:#05071099}
.dbody{padding:18px 18px 20px}
.dh{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.dpic{width:72px;height:72px;border-radius:10px;overflow:hidden;position:relative;flex:none;background:var(--grad,#333)}
.dpic img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.dh h3{margin:0;font:700 22px/1.2 var(--f-head)}
.dh p{margin:2px 0 0;color:var(--mute);font-size:13px}
.dh .x{margin-left:auto;align-self:flex-start}
.lv{margin-top:16px;display:grid;gap:8px}
.lv .seg{width:100%}
.lv .seg button{flex:1;padding:12px 0;font-family:var(--f-head);font-weight:600}
.lv .none{padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--mute)}
.lv .none[aria-pressed=true]{background:var(--panel2);color:var(--text);font-weight:600}
.preview{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;max-height:52vh;overflow:auto}
.preview img{max-width:100%;height:auto;display:block;margin:0 auto}
.preview p{margin:30px 0;color:var(--mute)}
.f{margin-top:16px}
.f>span.l{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.hint{color:var(--mute);font-size:13px;margin:8px 0 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media(max-width:700px){.bar{position:static}.elstat-wrap{width:100%}.elstat{grid-template-columns:repeat(7,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="who">
      <small>Genshin Impact roster</small>
      <input id="player" type="text" placeholder="Your name" maxlength="40" aria-label="Player name">
      <div class="uidrow"><label for="uid">UID</label><input id="uid" type="text" inputmode="numeric" maxlength="12" placeholder="optional"></div>
      <div class="prog" id="prog"></div>
    </div>
    <div class="elstat-wrap"><p>Characters owned by element</p><div class="elstat" id="elstat"></div></div>
  </header>
</div>

<div class="bar">
  <div class="wrap">
    <div class="row">
      <input id="q" class="field-in" type="search" placeholder="Search by name or version" aria-label="Search">
      <div class="seg" id="fStatus" role="group" aria-label="Ownership">
        <button data-v="all" aria-pressed="true">All</button><button data-v="own" aria-pressed="false">Owned</button><button data-v="miss" aria-pressed="false">Not owned</button>
      </div>
      <div class="seg" id="fRar" role="group" aria-label="Rarity">
        <button data-v="5" aria-pressed="true">5★</button><button data-v="4" aria-pressed="true">4★</button>
      </div>
    </div>
    <div class="row">
      <div class="chips" id="fEl" role="group" aria-label="Element"></div>
    </div>
    <div class="row">
      <div class="chips" id="fWp" role="group" aria-label="Weapon type"></div>
      <select id="fC" class="field-in" aria-label="Constellation level">
        <option value="all">All constellations</option><option value="0">C0</option><option value="1">C1</option><option value="2">C2</option><option value="3">C3</option><option value="4">C4</option><option value="5">C5</option><option value="6">C6</option>
      </select>
      <select id="sort" class="field-in" aria-label="Sort">
        <option value="verDesc">Version: newest first</option><option value="verAsc">Version: oldest first</option>
        <option value="cDesc">Constellation: high to low</option><option value="name">Name: A to Z</option><option value="el">Element</option>
      </select>
    </div>
    <div class="row">
      <button class="btn primary" id="btnImage">Save as image</button>
      <button class="btn" id="btnExport">Export data</button>
      <button class="btn" id="btnImport">Import data</button>
      <span class="spacer"></span>
      <button class="btn danger" id="btnClear">Clear data</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="note" id="warn"><span id="warnTxt"></span><button class="btn" id="warnBtn">Load images from files</button></div>
  <div class="note hint" id="hint">Tap a character to set whether you own it and its constellation. Everything is saved in this browser only.</div>
  <main id="main"></main>
</div>

<input type="file" id="inFiles" accept="image/*" multiple hidden>
<input type="file" id="inData" accept="application/json,.json" hidden>

<dialog id="dlgDetail"><div class="dbody" id="detail"></div></dialog>

<dialog id="dlgExport"><div class="dbody">
  <div class="dh"><h3>Save as image</h3><button class="btn x" data-close>Close</button></div>
  <div class="f" style="margin-top:12px"><span class="l">Layout</span>
    <div class="seg" id="xLayout"><button data-v="tall" aria-pressed="true">Portrait (phone)</button><button data-v="wide" aria-pressed="false">Landscape</button></div></div>
  <div class="preview" id="xPrev"><p>Building image</p></div>
  <p class="hint" id="xNote"></p>
  <div class="acts"><button class="btn primary" id="xSave">Download PNG</button></div>
</div></dialog>

<div id="toast" role="status" aria-live="polite"></div>

/* ---------- image cache (IndexedDB) ---------- */
let db = null;
const idbOpen = () => new Promise(res=>{ try{ const r=indexedDB.open('gi-roster-v2',1); r.onupgradeneeded=()=>r.result.createObjectStore('img'); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); }catch(e){res(null);} });
const idb = (mode, fn) => new Promise(res=>{ if(!db) return res(null); try{ const st=db.transaction('img',mode).objectStore('img'); const q=fn(st); q.onsuccess=()=>res(q.result===undefined?null:q.result); q.onerror=()=>res(null);}catch(e){res(null);} });
const idbGet = k => idb('readonly', s=>s.get(k));
const idbPut = (k,v) => idb('readwrite', s=>s.put(v,k));

/* ---------- image loading ---------- */
const imgs = new Map();   // key -> {src, kind:'blob'|'remote'|'fail'}
let queue = [], running = 0, chromeT;
const probe = u => new Promise(res=>{ const i=new Image(); i.onload=()=>res(true); i.onerror=()=>res(false); i.src=u; });
function setImg(key, src, kind){
  const old=imgs.get(key); if(old&&old.kind==='blob'&&old.src!==src) URL.revokeObjectURL(old.src);
  imgs.set(key,{src,kind});
  if(key.startsWith('el:')||key.startsWith('wp:')){ clearTimeout(chromeT); chromeT=setTimeout(()=>{ buildChips(); render(); },120); return; }
  const p=document.querySelector(`[data-card="${CSS.escape(key)}"] .portrait`); if(p) p.innerHTML=picHtml(key);
}
async function loadAsset(key, urls){
  const blob = await idbGet(key);
  if(blob){ setImg(key, URL.createObjectURL(blob), 'blob'); return; }
  for(const u of urls){
    try{
      const r = await fetch(u,{mode:'cors'});
      if(r.ok){ const b=await r.blob(); if(b.type.startsWith('image')){ idbPut(key,b); setImg(key, URL.createObjectURL(b), 'blob'); return; } }
      continue;
    }catch(e){ /* CORS or network: try a plain <img> for display only */ }
    if(await probe(u)){ setImg(key,u,'remote'); return; }
  }
  imgs.set(key,{src:'',kind:'fail'});
}
function pump(){
  while(running<6 && queue.length){
    const job=queue.shift(); running++;
    loadAsset(job.key, job.urls).catch(()=>{}).finally(()=>{running--; pump(); updateNote();});
  }
}
function queueImages(list){
  list.forEach(c=>{ if(!imgs.has(c.id) && !queue.some(q=>q.key===c.id)) queue.push({key:c.id, urls:c.ids.map(charUrl)}); });
  pump();
}
function queueElements(){ EL_ORDER.forEach(k=>queue.unshift({key:'el:'+k, urls:[elUrl(k)]})); WP_ORDER.forEach(k=>queue.unshift({key:'wp:'+k, urls:[wpUrl(k)]})); pump(); }

function updateNote(){
  const w=$('#warn');
  const vals=[...imgs.entries()].filter(([k])=>!k.startsWith('el:')&&!k.startsWith('wp:')).map(([,v])=>v);
  const fails=vals.filter(v=>v.kind==='fail').length, remote=vals.filter(v=>v.kind==='remote').length;
  let txt='';
  if(!storageOK) txt='This browser will not keep data between visits. Use Export data to keep a copy before you close the page.';
  else if(running===0 && fails) txt=`${fails} portrait${fails>1?'s':''} could not be loaded and show a colored card instead.`;
  else if(running===0 && remote) txt=`${remote} portrait${remote>1?'s are':' is'} shown from the web but cannot be copied into saved images.`;
  $('#warnTxt').textContent=txt;
  $('#warnBtn').style.display = (running===0 && (fails||remote)) ? '' : 'none';
  w.classList.toggle('show', !!txt);
  $('#hint').classList.toggle('show', Object.keys(S.owned).length===0);
}

/* ---------- filtering / sorting ---------- */
const SORTS = {
  verDesc:(a,b)=>b.ord-a.ord, verAsc:(a,b)=>a.ord-b.ord,
  cDesc:(a,b)=>((b.lvl??-1)-(a.lvl??-1))||(b.ord-a.ord),
  name:(a,b)=>a.name.localeCompare(b.name),
  el:(a,b)=>(EL_ORDER.indexOf(a.el)-EL_ORDER.indexOf(b.el))||(b.ord-a.ord)
};
function filterSort(all){
  const q=F.q.trim().toLowerCase();
  return all.filter(c=>{
    if(c.rar===5 && !F.r5) return false;
    if(c.rar===4 && !F.r4) return false;
    if(F.els.size && !F.els.has(c.el)) return false;
    if(F.wps.size && !F.wps.has(c.w)) return false;
    const own=c.lvl!==undefined;
    if(F.status==='own' && !own) return false;
    if(F.status==='miss' && own) return false;
    if(F.c!=='all'){
      if(!own || c.lvl!==+F.c) return false;
    }
    if(q && !(c.name.toLowerCase().includes(q) || String(c.ver).startsWith(q))) return false;
    return true;
  }).sort(SORTS[S.sort]||SORTS.verDesc);
}

/* ---------- rendering ---------- */
function stats(all){
  const own=all.filter(c=>c.lvl!==undefined);
  let pct = all.length ? Math.round(own.length/all.length*100) : 0;
  if(own.length<all.length && pct===100) pct=99;
  const byEl={}; EL_ORDER.forEach(k=>byEl[k]=[own.filter(c=>c.el===k).length, all.filter(c=>c.el===k).length]);
  const rc=r=>[own.filter(c=>c.rar===r).length, all.filter(c=>c.rar===r).length];
  return {own:own.length,total:all.length,pct,byEl,r5:rc(5),r4:rc(4)};
}
function renderStats(all){
  const st=stats(all);
  $('#prog').innerHTML=`<span class="pct">${st.pct}%</span><span class="frac">${st.own}/${st.total}</span><span class="rar r5">5★<b>${st.r5[0]}/${st.r5[1]}</b></span><span class="rar r4">4★<b>${st.r4[0]}/${st.r4[1]}</b></span>`;
  const mx=Math.max(1,...EL_ORDER.map(k=>st.byEl[k][0]));
  $('#elstat').innerHTML=EL_ORDER.map(k=>`<div style="--el:${EL[k].c}" title="${EL[k].n}: ${st.byEl[k][0]} of ${st.byEl[k][1]}"><em>${st.byEl[k][0]}</em><i style="height:${Math.max(3,Math.round(st.byEl[k][0]/mx*44))}px"></i>${elIcon(k)}</div>`).join('');
}
const picHtml = id => {
  const im=imgs.get(id), c=byId(id); if(!c) return '';
  const own=c.lvl!==undefined;
  return `${im&&im.src?`<img class="pic" src="${esc(im.src)}" alt="" draggable="false">`:`<span class="ph">${esc(c.name.trim().charAt(0))}</span>`}`+
    `<span class="elb" title="${EL[c.el].n}">${elIcon(c.el)}</span>${own?`<span class="clab${c.ref?' sm':''}${c.lvl===6?' c6':''}">C${c.lvl}${c.ref?'R'+c.ref:''}</span>`:''}`;
};
function card(c){
  const own=c.lvl!==undefined;
  const whale=own&&c.lvl===6&&c.ref===5, gold=own&&c.ref>=1&&!whale;
  return `<article class="card r${c.rar}${own?'':' off'}${gold?' gold':''}${whale?' whale':''}" data-card="${esc(c.id)}" style="--el:${EL[c.el].c}">${whale?'<span class="ring"><i></i></span>':''}
    <button class="portrait" data-open="${esc(c.id)}" aria-label="Edit ${esc(c.name)}">${picHtml(c.id)}</button>
    <div class="nm" title="${esc(c.name)}">${esc(c.name)}</div></article>`;
}
function render(){
  const all=chars(); renderStats(all);
  const rb=document.querySelector('[data-reset]'); if(rb) rb.disabled=!(F.q.trim()||!F.r5||!F.r4||F.els.size||F.wps.size||F.status!=='all'||F.c!=='all');
  const list=filterSort(all);
  let html='';
  for(const r of [5,4]){
    const sec=list.filter(c=>c.rar===r); if(!sec.length) continue;
    const tot=all.filter(c=>c.rar===r && (!F.els.size||F.els.has(c.el)) && (!F.wps.size||F.wps.has(c.w))), own=tot.filter(c=>c.lvl!==undefined && (F.c==='all'||c.lvl===+F.c)).length;
    html+=`<section class="sec"><h2><span class="star r${r}">${r}★</span><small>${F.status==='miss' ? `${tot.length-own} of ${tot.length} not owned` : `${own} of ${tot.length} owned`}</small></h2><div class="grid">${sec.map(card).join('')}</div></section>`;
  }
  $('#main').innerHTML = html || `<p class="empty">No characters match the current filters.</p>`;
  queueImages(list); updateNote();
}
function patch(){ render(); }

/* ---------- controls ---------- */
$('#player').value=S.player; $('#uid').value=S.uid;
$('#player').addEventListener('input',e=>{S.player=e.target.value;persist();});
$('#uid').addEventListener('input',e=>{S.uid=e.target.value.replace(/\D/g,'');e.target.value=S.uid;persist();});
$('#q').addEventListener('input',e=>{F.q=e.target.value;render();});
$('#fStatus').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; $('#fStatus').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); F.status=b.dataset.v; render(); });
$('#fRar').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const k='r'+b.dataset.v; F[k]=!F[k]; b.setAttribute('aria-pressed',F[k]); render(); });
$('#fC').addEventListener('change',e=>{F.c=e.target.value;render();});
$('#sort').value=S.sort;
$('#sort').addEventListener('change',e=>{S.sort=e.target.value;persist();render();});
function buildChips(){
  $('#fWp').innerHTML = WP_ORDER.map(k=>`<button class="chip" data-wp="${k}" aria-pressed="${F.wps.has(k)}" style="--el:#d8d2f2">${wpIcon(k)}${WP[k]}</button>`).join('') + '<button class="chip reset" data-reset>Reset filters</button>';
  $('#fEl').innerHTML = EL_ORDER.map(k=>`<button class="chip" data-el="${k}" aria-pressed="${F.els.has(k)}" style="--el:${EL[k].c}">${elIcon(k)}${EL[k].n}</button>`).join('');
}
$('#fEl').addEventListener('click',e=>{ const b=e.target.closest('[data-el]'); if(!b) return; const k=b.dataset.el; F.els.has(k)?F.els.delete(k):F.els.add(k); b.setAttribute('aria-pressed',F.els.has(k)); render(); });
function resetFilters(){
  F.q=''; F.r5=F.r4=true; F.els.clear(); F.wps.clear(); F.status='all'; F.c='all';
  $('#q').value=''; $('#fC').value='all';
  $('#fStatus').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v==='all'));
  $('#fRar').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','true'));
  buildChips(); render();
}
$('#fWp').addEventListener('click',e=>{ if(e.target.closest('[data-reset]')){ resetFilters(); return; } const b=e.target.closest('[data-wp]'); if(!b) return; const k=b.dataset.wp; F.wps.has(k)?F.wps.delete(k):F.wps.add(k); b.setAttribute('aria-pressed',F.wps.has(k)); render(); });
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{ if(e.target.closest('[data-close]')||e.target===d) d.close(); }));

/* ---------- edit dialog ---------- */
let curId=null;
$('#main').addEventListener('click',e=>{ const op=e.target.closest('[data-open]'); if(op){ curId=op.dataset.open; fillDetail(); $('#dlgDetail').showModal(); } });
function fillDetail(){

  $('#detail').innerHTML=`
  <div class="dh">
    <div class="dpic" style="--grad:${c.rar===5?'linear-gradient(165deg,#6f4a22,#f2c775)':'linear-gradient(165deg,#3f3377,#bba5ee)'}">${im&&im.src?`<img src="${esc(im.src)}" alt="">`:''}</div>
    <div><h3>${esc(c.name)}</h3><p>${c.rar}★ character from version ${esc(c.ver)}</p></div>
    <button class="btn x" data-close>Done</button>
  </div>
  <div class="lv">
    <button class="none" data-lv="-1" aria-pressed="${!own}">Not owned</button>
    <div class="seg">${[0,1,2,3,4,5,6].map(n=>`<button data-lv="${n}" aria-pressed="${own&&c.lvl===n}">C${n}</button>`).join('')}</div>
    ${c.rar===5&&own?`<p class="hint" style="margin:8px 0 -2px">Signature weapon refinement</p><div class="seg"><button data-r="0" aria-pressed="${!c.ref}">None</button>${[1,2,3,4,5].map(n=>`<button data-r="${n}" aria-pressed="${c.ref===n}">R${n}</button>`).join('')}</div>`:''}

$('#dlgDetail').addEventListener('click',e=>{
  const c=byId(curId); if(!c) return;
  const r=e.target.closest('[data-r]');
  if(r){ const k=+r.dataset.r; if(k) S.refine[curId]=k; else delete S.refine[curId]; persist(); patch(curId); setTimeout(()=>$('#dlgDetail').close(),140); return; }
  const b=e.target.closest('[data-lv]'); if(!b) return;
  const n=+b.dataset.lv;
  if(n<0){ delete S.owned[curId]; delete S.refine[curId]; } else S.owned[curId]=n;
  persist(); patch(curId);
  if(n<0||c.rar===4) setTimeout(()=>$('#dlgDetail').close(),140); else fillDetail();
});

/* ---------- data export / import / clear ---------- */
const download=(blob,name)=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); };
$('#btnExport').onclick=()=>{
  const data={app:'genshin-roster',v:2,player:S.player,uid:S.uid,owned:S.owned,refine:S.refine};
  download(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}),'genshin-roster-data.json'); toast('Data exported');
};
$('#btnImport').onclick=()=>$('#inData').click();
$('#inData').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const j=JSON.parse(await f.text()); const src=j.owned||(j.state&&j.state.owned);
    if(j.app!=='genshin-roster'||!src||typeof src!=='object') throw 0;
    const ids=new Set(SEED.map(c=>c.id)), owned={};
    for(const [k,v] of Object.entries(src)) if(ids.has(k) && Number.isInteger(v) && v>=0 && v<=6) owned[k]=v;
    const refine={}, five=new Set(SEED.filter(c=>c.rar===5).map(c=>c.id));
    for(const [k,v] of Object.entries(j.refine||{})) if(five.has(k) && owned[k]!==undefined && Number.isInteger(v) && v>=1 && v<=5) refine[k]=v;
    if(!confirm(`Import ${Object.keys(owned).length} characters? This replaces your current data.`)) return;
    S.owned=owned; S.refine=refine; S.player=j.player||(j.state&&j.state.player)||S.player; S.uid=j.uid||(j.state&&j.state.uid)||S.uid;
    $('#player').value=S.player; $('#uid').value=S.uid; persist(); render(); toast('Data imported');
  }catch(err){ toast('That file is not a roster export from this tool'); }
};
$('#btnClear').onclick=()=>{
  if(!confirm('Clear all data? Every owned character and constellation you entered will be removed.')) return;
  S.owned={}; S.refine={}; persist(); render(); toast('Data cleared');
};

/* ---------- load portraits from local files (fallback) ---------- */
async function shrink(file,size=256){
  const bmp=await createImageBitmap(file), cv=document.createElement('canvas'); cv.width=cv.height=size;
  const s=Math.max(size/bmp.width,size/bmp.height), w=bmp.width*s, h=bmp.height*s;
  cv.getContext('2d').drawImage(bmp,(size-w)/2,(size-h)*0.25,w,h);
  return new Promise(res=>cv.toBlob(res,'image/png'));
}
$('#warnBtn').onclick=()=>$('#inFiles').click();
$('#inFiles').onchange=async e=>{
  const files=[...e.target.files]; e.target.value=''; const all=chars(); let n=0;
  for(const f of files){
    if(!f.type.startsWith('image/')) continue; const key=norm(f.name); if(!key) continue;
    const c=all.find(c=>c.ids.some(i=>norm(i)===key)||norm(c.name)===key); if(!c) continue;
    try{ const b=await shrink(f); await idbPut(c.id,b); setImg(c.id,URL.createObjectURL(b),'blob'); n++; }catch(err){}
  }
  updateNote(); toast(n?`Matched ${n} image${n>1?'s':''}`:'No file names matched a character');
};

/* ---------- save as image ---------- */
const X={layout:'tall',blob:null,url:null};
$('#xLayout').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; $('#xLayout').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); X.layout=b.dataset.v; buildPreview(); });
$('#btnImage').onclick=()=>{ $('#dlgExport').showModal(); buildPreview(); };
const loadEl=(src,cors)=>new Promise(r=>{const i=new Image(); if(cors) i.crossOrigin='anonymous'; i.onload=()=>r(i); i.onerror=()=>r(null); i.src=src;});
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else { ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); } }
function rainbow(ctx,x,y,w,h){
  const g=ctx.createConicGradient?ctx.createConicGradient(-Math.PI/2,x+w/2,y+h/2):ctx.createLinearGradient(x,y,x+w,y+h);
  const cs=['#ff5f6d','#ffc371','#fff56b','#6bffb0','#5fc8ff','#a07bff','#ff6bd6','#ff5f6d']; cs.forEach((c,i)=>g.addColorStop(i/(cs.length-1),c)); return g;
}
function drawEl(ctx,k,cx,cy,size,color,elImgs){
  const im=elImgs.get(k);
  if(im){ const s=Math.min(size/im.width,size/im.height); ctx.drawImage(im,cx-im.width*s/2,cy-im.height*s/2,im.width*s,im.height*s); return; }
  const e=EL[k]; ctx.save(); ctx.translate(cx-size/2,cy-size/2); ctx.scale(size/24,size/24);
  const p=new Path2D(e.d); if(e.t==='f'){ctx.fillStyle=color;ctx.fill(p);} else {ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke(p);}
  ctx.restore();
}
async function buildExport(){
  try{ await Promise.all([document.fonts.load('700 30px Kanit'),document.fonts.load('500 14px Kanit'),document.fonts.load('400 14px "IBM Plex Sans"')]); }catch(e){}
  const all=chars(), st=stats(all);
  const items=all.filter(c=>c.lvl!==undefined).sort(SORTS[S.sort]||SORTS.verDesc);
  const tall=X.layout==='tall', cols=tall?5:10, CW=128, CH=160, G=10, PAD=28, SEC=46;
  const secs=[5,4].map(r=>({r,list:items.filter(c=>c.rar===r),tot:all.filter(c=>c.rar===r).length,own:all.filter(c=>c.rar===r&&c.lvl!==undefined).length})).filter(s=>s.list.length);
  const W=PAD*2+cols*CW+(cols-1)*G, HH=tall?202:122;
  let H=PAD+HH; secs.forEach(s=>{ H+=SEC+Math.ceil(s.list.length/cols)*(CH+G); }); H+=PAD+10;
  const scale=Math.min(2,Math.sqrt(13e6/(W*H)));
  const cv=document.createElement('canvas'); cv.width=Math.round(W*scale); cv.height=Math.round(H*scale);
  const ctx=cv.getContext('2d'); ctx.scale(scale,scale);
  const FH='Kanit,"IBM Plex Sans",sans-serif', FB='"IBM Plex Sans",sans-serif';
  const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#1c2040'); bg.addColorStop(1,'#12152a'); ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  // load element + character images
  const elImgs=new Map();
  await Promise.all(EL_ORDER.map(async k=>{ const im=imgs.get('el:'+k); if(im&&im.src){ const i=await loadEl(im.src,im.kind==='remote'); if(i) elImgs.set(k,i); } }));
  let missing=0; const pics=new Map();
  await Promise.all(items.map(async c=>{ const im=imgs.get(c.id); if(!im||!im.src){ if(c.lvl!==undefined) missing++; return; } const i=await loadEl(im.src,im.kind==='remote'); if(i) pics.set(c.id,i); else if(c.lvl!==undefined) missing++; }));
  // header
  ctx.textAlign='left'; ctx.fillStyle='#9ea2c6'; ctx.font=`400 14px ${FB}`; ctx.fillText('Genshin Impact roster'+(S.uid?`   UID ${S.uid}`:''),PAD,PAD+14);
  ctx.fillStyle='#eceaf7'; ctx.font=`700 36px ${FH}`; ctx.fillText(S.player||'My characters',PAD,PAD+54);
  ctx.font=`700 40px ${FH}`; const pt=st.pct+'%'; ctx.fillText(pt,PAD,PAD+104); const ptw=ctx.measureText(pt).width;
  ctx.fillStyle='#9ea2c6'; ctx.font=`500 18px ${FH}`; const fr=`${st.own}/${st.total}`; ctx.fillText(fr,PAD+ptw+12,PAD+104);
  let rx=PAD+ptw+12+ctx.measureText(fr).width+22;
  [['5★',st.r5,'#f0c060'],['4★',st.r4,'#b9a2ec']].forEach(([l,v,col])=>{ ctx.fillStyle=col; ctx.font=`500 17px ${FH}`; ctx.fillText(l,rx,PAD+104); rx+=ctx.measureText(l).width+6; ctx.fillStyle='#eceaf7'; ctx.font=`700 17px ${FH}`; const s=`${v[0]}/${v[1]}`; ctx.fillText(s,rx,PAD+104); rx+=ctx.measureText(s).width+18; });
  const hx=tall?PAD:W-PAD-7*42, hy=tall?PAD+134:PAD+4, hh=tall?26:50, mx=Math.max(1,...EL_ORDER.map(k=>st.byEl[k][0]));
  EL_ORDER.forEach((k,i)=>{
    const bx=hx+i*42, bh=Math.max(3,Math.round(st.byEl[k][0]/mx*hh)), by=hy+hh-bh, col=EL[k].c;
    ctx.fillStyle=col; rr(ctx,bx+4,by,26,bh,3); ctx.fill();
    ctx.textAlign='center'; ctx.fillStyle='#eceaf7'; ctx.font=`600 13px ${FH}`; ctx.fillText(String(st.byEl[k][0]),bx+17,by-5);
    drawEl(ctx,k,bx+17,hy+hh+17,22,col,elImgs);
  });
  let y=PAD+HH;
  for(const s of secs){
    ctx.textAlign='left'; ctx.fillStyle=s.r===5?'#f0c060':'#b9a2ec'; ctx.font=`700 24px ${FH}`; ctx.fillText(s.r+'★',PAD,y+30);
    const tw=ctx.measureText(s.r+'★').width; ctx.fillStyle='#9ea2c6'; ctx.font=`400 14px ${FB}`; ctx.fillText(`${s.own} of ${s.tot} owned`,PAD+tw+10,y+30);
    y+=SEC;
    s.list.forEach((c,i)=>{
      const x=PAD+(i%cols)*(CW+G), cy=y+Math.floor(i/cols)*(CH+G);
      const own=c.lvl!==undefined, col=EL[c.el].c;
      ctx.save(); rr(ctx,x,cy,CW,CH,10); ctx.clip();
      ctx.fillStyle='#232844'; ctx.fillRect(x,cy,CW,CH);
      const g=ctx.createLinearGradient(x,cy,x+CW*0.4,cy+CW);
      if(!own){g.addColorStop(0,'#2a2d47');g.addColorStop(1,'#3c4062');} else if(c.rar===5){g.addColorStop(0,'#6f4a22');g.addColorStop(.58,'#c58b3c');g.addColorStop(1,'#f2c775');} else {g.addColorStop(0,'#3f3377');g.addColorStop(.58,'#7860b6');g.addColorStop(1,'#bba5ee');}
      ctx.fillStyle=g; ctx.fillRect(x,cy,CW,CW);
      const im=pics.get(c.id);
      if(im) ctx.drawImage(im,x,cy,CW,CW); else { ctx.fillStyle='#ffffff40'; ctx.font=`700 52px ${FH}`; ctx.textAlign='center'; ctx.fillText(c.name.trim().charAt(0),x+CW/2,cy+CW/2+18); }
      if(!own){ ctx.fillStyle='rgba(20,23,42,.62)'; ctx.fillRect(x,cy,CW,CH); }
      ctx.restore();
      ctx.fillStyle='rgba(16,19,34,.65)'; ctx.beginPath(); ctx.arc(x+19,cy+19,12,0,7); ctx.fill(); drawEl(ctx,c.el,x+19,cy+19,17,own?col:'#8a8dad',elImgs);
      const framed=own&&c.ref>=1, whale=own&&c.lvl===6&&c.ref===5;
      if(own){
        const sm=!!c.ref, lab='C'+c.lvl+(sm?'R'+c.ref:''), hh=sm?19:22, c6=c.lvl===6;
        ctx.font=`700 ${sm?12:14}px ${FH}`; const w=ctx.measureText(lab).width+(sm?12:14);
        ctx.fillStyle=c6?'#f0c060':'rgba(16,19,42,.85)'; rr(ctx,x+CW-w-6,cy+CW-6-hh,w,hh,sm?5:6); ctx.fill();
        ctx.fillStyle=c6?'#2a1c05':'#eceaf7'; ctx.textAlign='center'; ctx.fillText(lab,x+CW-6-w/2,cy+CW-6-(sm?5.5:6));
      }
      ctx.textAlign='center'; ctx.fillStyle=own?'#eceaf7':'#9ea2c6'; ctx.font=`500 13px ${FH}`;
      let nm=c.name; while(ctx.measureText(nm).width>CW-12 && nm.length>3) nm=nm.slice(0,-1); if(nm!==c.name) nm=nm.trimEnd()+'…';
      ctx.fillText(nm,x+CW/2,cy+CW+21);
      if(whale){ ctx.save(); ctx.shadowColor='rgba(182,140,255,.75)'; ctx.shadowBlur=9; ctx.lineWidth=3.8; ctx.strokeStyle=rainbow(ctx,x,cy,CW,CH); rr(ctx,x+1.9,cy+1.9,CW-3.8,CH-3.8,10); ctx.stroke(); ctx.restore(); }
      else if(framed){ ctx.lineWidth=2; ctx.strokeStyle='#f0c060'; rr(ctx,x+1,cy+1,CW-2,CH-2,10); ctx.stroke(); }
    });
    y+=Math.ceil(s.list.length/cols)*(CH+G);
  }
  ctx.textAlign='right'; ctx.fillStyle='#6d7299'; ctx.font=`400 12px ${FB}`;
  ctx.fillText(new Date().toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'}),W-PAD,H-PAD+4);
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  return {blob,missing};
}
let prevTok=0;
async function buildPreview(){
  const tok=++prevTok, box=$('#xPrev'); box.innerHTML='<p>Building image</p>'; $('#xNote').textContent='';
  try{
    if(!Object.keys(S.owned).length){ X.blob=null; box.innerHTML='<p>Nothing to show yet. Mark the characters you own first.</p>'; return; }
    for(let i=0;i<40 && (running>0||queue.length);i++) await new Promise(r=>setTimeout(r,150));
    const {blob,missing}=await buildExport(); if(tok!==prevTok) return;
    X.blob=blob; if(X.url) URL.revokeObjectURL(X.url); X.url=URL.createObjectURL(blob);
    box.innerHTML=`<img src="${X.url}" alt="Roster preview">`;
    $('#xNote').textContent = missing ? `${missing} owned character${missing>1?'s have':' has'} no portrait in this image because the browser blocks images from other sites. Use "Load images from files" at the top of the page.` : '';
  }catch(err){ box.innerHTML='<p>Could not build the image. Try again.</p>'; }
}
$('#xSave').onclick=()=>{ if(X.blob) download(X.blob,'genshin-roster.png'); };

/* ---------- init ---------- */
(async()=>{ db=await idbOpen(); buildChips(); render(); queueElements(); })();
})();
